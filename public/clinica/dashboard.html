<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Clínica - na.MED</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-dash { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2563eb; padding-bottom: 15px; margin-bottom: 20px; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .filter-bar { display: flex; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; align-items: center; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; font-weight: bold; color: #475569; }
        .filter-group input, .filter-group select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; min-width: 180px; }

        .table-appointments { width: 100%; border-collapse: collapse; margin-top: 25px; }
        .table-appointments th, .table-appointments td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-modal { float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-dash">
        <h2>🏥 Painel de Controle - Clínica</h2>
        <button id="btnLogout" class="btn-logout">Sair</button>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Filtrar por Data:</label>
            <input type="date" id="filterDate">
        </div>
        <div class="filter-group">
            <label>Tipo:</label>
            <select id="filterType"><option value="medico">Consultas</option><option value="exame">Exames</option></select>
        </div>
        <div class="filter-group">
            <label id="labelDynamicSelect">Profissional:</label>
            <select id="filterDynamic"><option value="">Selecione...</option></select>
        </div>
        <button id="btnClearFilters" style="margin-top:18px; padding:8px;">Limpar</button>
    </div>
    
    <table class="table-appointments"><tbody id="clinicAppointmentsTable"></tbody></table>
</div>

<!-- Modal Agendamento -->
<div id="seuModalId" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal" onclick="document.getElementById('seuModalId').style.display='none'">&times;</span>
        <h3>🗓️ Agendamento Rápido</h3>
        <div class="form-group">
            <label>Horário:</label>
            <input type="text" id="campoHorario" readonly style="background:#f1f5f9; padding:10px; width:100%;">
        </div>
        <div class="form-group" style="position: relative;">
            <label>Paciente:</label>
            <input type="text" id="campoBuscaPaciente" placeholder="Digite nome ou CPF..." style="padding:10px; width:100%;">
            <div id="listaResultados" style="position:absolute; top: 100%; width: 100%; background:white; border:1px solid #cbd5e1; display:none; z-index:1000;"></div>
        </div>
        <button onclick="salvarAgendamentoRapido()" style="width:100%; padding:12px; background:#16a34a; color:white; border:none; cursor:pointer;">Confirmar</button>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    
    document.addEventListener('DOMContentLoaded', async () => {
        // Inicializações principais
        await carregarCatalogosIniciais();
        alternarSelectDinamico();
        await carregarConsultasClinica();

        // Configura busca de paciente com segurança
        const inputBusca = document.getElementById('campoBuscaPaciente');
        const listaResultados = document.getElementById('listaResultados');

        if (inputBusca) {
            inputBusca.addEventListener('input', async (e) => {
                const termo = e.target.value.trim();
                if (termo.length < 3) { listaResultados.style.display = 'none'; return; }

                const res = await fetch(`/api/auth/pesquisar-pacientes?busca=${encodeURIComponent(termo)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success && data.patients.length > 0) {
                    listaResultados.innerHTML = '';
                    data.patients.forEach(p => {
                        const div = document.createElement('div');
                        div.style.padding = '10px'; div.style.cursor = 'pointer';
                        div.innerText = `${p.name}`;
                        div.onclick = () => {
                            inputBusca.value = p.name;
                            inputBusca.dataset.id = p.id;
                            listaResultados.style.display = 'none';
                        };
                        listaResultados.appendChild(div);
                    });
                    listaResultados.style.display = 'block';
                }
            });
        }
    });

    // ... [Mantenha suas funções existentes de carregarConsultasClinica, renderizarTabela, etc] ...

    async function salvarAgendamentoRapido() {
        const pacienteId = document.getElementById('campoBuscaPaciente').dataset.id;
        const horario = document.getElementById('campoHorario').value;
        if (!pacienteId) { alert("Selecione um paciente!"); return; }
        
        // ... [Lógica de POST para /api/appointments] ...
    }
</script>
</body>
</html>
